[project]
name = "single-agent-rag-baseline"
version = "0.1.0"
description = "Baseline Single-Agent RAG Pipeline (Hybrid Search + Reranking)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vardah Rehman" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "streamlit>=1.38.0",
    "pydantic>=2.9.2",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.0.1",
    "torch>=2.4.1",
    "numpy>=1.26.4",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "pillow>=10.4.0",
    "pytesseract>=0.3.10",
    "langchain>=0.3.1",
    "langchain-text-splitters>=0.3.0",
    "requests>=2.32.3",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"